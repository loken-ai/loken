<svg xmlns="http://www.w3.org/2000/svg" class="ly" viewBox="0 0 1000 640" role="img" aria-label="A placement board: each card is a column as tall as its free memory, ranked from left to right by compute rate, the host a wide memory bank, and the 24 layers of a model equal blocks that the plan stacks in them">
  <defs>
    <linearGradient id="ly-pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ly-pcb0)"/><stop offset="1" style="stop-color:var(--ly-pcb1)"/></linearGradient>
    <linearGradient id="ly-host" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ly-host0)"/><stop offset="1" style="stop-color:var(--ly-host1)"/></linearGradient>
    <linearGradient id="ly-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--ly-host1)"/><stop offset=".5" style="stop-color:var(--ly-host0)"/><stop offset="1" style="stop-color:var(--ly-host1)"/></linearGradient>
    <pattern id="ly-trace" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 9 H12 L19 16 H36 M7 0 V5 M27 36 V27 L32 22 M0 29 H9 L14 24" style="fill:none;stroke:var(--ly-trace);stroke-width:1.1;opacity:.28"/><circle cx="19" cy="16" r="1.5" style="fill:var(--ly-trace);opacity:.4"/></pattern>
    <pattern id="ly-gold" width="7" height="12" patternUnits="userSpaceOnUse"><rect x="1" width="5" height="12" rx="1" style="fill:var(--ly-au)"/></pattern>
    <pattern id="ly-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--ly-well)"/><rect width="2.2" height="6" style="fill:var(--ly-res);opacity:.55"/></pattern>
    <pattern id="ly-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" style="fill:var(--ly-grid)"/></pattern>

    <g data-sprite="bolt" class="bolt"><path d="M3,-15 L-8,2 L-1.5,2 L-4,15 L8,-3 L1.5,-3 Z"/></g>
    <g data-sprite="cross" class="cross"><circle r="11"/><path d="M-5,-5 L5,5 M5,-5 L-5,5"/></g>
    <g data-sprite="check" class="check"><circle r="10"/><path d="M-4.5,0.5 L-1,4 L5,-3.5"/></g>
  </defs>

  <!-- Carriers of the patterns: the story reads their fill, written with the ids the page gives the figure. -->
  <g style="display:none">
    <rect data-name="f-pcb" style="fill:url(#ly-pcb)" width="1" height="1"/>
    <rect data-name="f-host" style="fill:url(#ly-host)" width="1" height="1"/>
    <rect data-name="f-trace" style="fill:url(#ly-trace)" width="1" height="1"/>
    <rect data-name="f-gold" style="fill:url(#ly-gold)" width="1" height="1"/>
    <rect data-name="f-hatch" style="fill:url(#ly-hatch)" width="1" height="1"/>
    <rect data-name="f-wood" style="fill:url(#ly-wood)" width="1" height="1"/>
  </g>

  <!-- The board. -->
  <rect class="panel" x="250" y="6" width="500" height="628" rx="14"/>
  <rect x="256" y="70" width="488" height="490" style="fill:url(#ly-dots)"/>

  <!-- Where the stack sits: the spine of the body is the layer stack. -->
  <g class="where">
    <circle class="skin" cx="274" cy="22" r="7"/>
    <path class="skin" d="M264,33 Q274,29 284,33 L287,58 Q274,62 261,58 Z"/>
    <path class="spine" d="M274,32 V58"/>
    <text class="where-t" x="294" y="30">LAYER STACK</text>
    <text class="where-s" x="294" y="54">the spine of lokend, laid out on its devices</text>
  </g>

  <!-- The slot rail the devices stand in. -->
  <rect class="rail" x="258" y="562" width="484" height="14" rx="3"/>
  <rect class="rail-slot" x="264" y="567" width="472" height="4" rx="2"/>

  <!-- The board at rest: the 3 devices, a model laid on the cards, the key of the blocks and the invitation to pick a scene. -->
  <g class="rest">
    <rect class="card-bg" x="266" y="72" width="468" height="98" rx="10"/>
    <text class="invite mid" x="500" y="104">PICK A SCENE ABOVE</text>
    <text class="rest-t mid" x="500" y="130">7 ways to lay 24 layers on 2 cards and the host</text>
    <text class="rest-s mid" x="500" y="157">then press Play, or a step number</text>
    <text class="rest-t mid" x="500" y="204">A column is a device, as tall as its free memory.</text>
    <text class="rest-s mid" x="500" y="228">The cards stand left to right by compute rate.</text>
    <rect class="col-shd" x="276" y="306" width="116" height="262" rx="9"/><rect class="col-a" style="fill:url(#ly-pcb)" x="272" y="302" width="116" height="264" rx="9"/><rect class="col-tex" style="fill:url(#ly-trace)" x="272" y="302" width="116" height="264" rx="9"/><rect class="fing" style="fill:url(#ly-gold)" x="282" y="564" width="96" height="9"/><rect class="well" x="279" y="310" width="102" height="250" rx="4"/><rect class="chip" x="273.5" y="320" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="320" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="346" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="346" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="372" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="372" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="398" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="398" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="424" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="424" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="450" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="450" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="476" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="476" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="502" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="502" width="4" height="12" rx="1"/><rect class="chip" x="273.5" y="528" width="4" height="12" rx="1"/><rect class="chip" x="382.5" y="528" width="4" height="12" rx="1"/><rect class="stripe-a" x="279" y="305" width="102" height="3" rx="1.5"/>
    <rect class="col-shd" x="408" y="356" width="116" height="212" rx="9"/><rect class="col-b" style="fill:url(#ly-pcb)" x="404" y="352" width="116" height="214" rx="9"/><rect class="col-tex" style="fill:url(#ly-trace)" x="404" y="352" width="116" height="214" rx="9"/><rect class="fing" style="fill:url(#ly-gold)" x="414" y="564" width="96" height="9"/><rect class="well" x="411" y="360" width="102" height="200" rx="4"/><rect class="chip" x="405.5" y="370" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="370" width="4" height="12" rx="1"/><rect class="chip" x="405.5" y="396" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="396" width="4" height="12" rx="1"/><rect class="chip" x="405.5" y="422" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="422" width="4" height="12" rx="1"/><rect class="chip" x="405.5" y="448" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="448" width="4" height="12" rx="1"/><rect class="chip" x="405.5" y="474" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="474" width="4" height="12" rx="1"/><rect class="chip" x="405.5" y="500" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="500" width="4" height="12" rx="1"/><rect class="chip" x="405.5" y="526" width="4" height="12" rx="1"/><rect class="chip" x="514.5" y="526" width="4" height="12" rx="1"/><rect class="stripe-b" x="411" y="355" width="102" height="3" rx="1.5"/>
    <rect class="col-shd" x="540" y="326" width="200" height="242" rx="9"/><rect class="col-h" style="fill:url(#ly-host)" x="536" y="322" width="200" height="244" rx="9"/><rect class="well-h" x="543" y="330" width="186" height="230" rx="4"/><rect class="stripe-h" x="543" y="325" width="186" height="3" rx="1.5"/>
    <path class="cut" d="M543,328 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 l11.6,-8 l11.6,8 V336 H543 Z"/>
    <rect class="blk res" style="fill:url(#ly-hatch)" x="279" y="310" width="102" height="18" rx="2"/><text class="rest-in mid halo" x="330" y="324">reserve</text>
    <rect class="blk res" style="fill:url(#ly-hatch)" x="411" y="360" width="102" height="18" rx="2"/><text class="rest-in mid halo" x="462" y="374">reserve</text>
    <rect class="blk a" x="279" y="546.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="546.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="531.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="531.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="516.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="516.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="501.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="501.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="486.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="486.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="471.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="471.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="456.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="456.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="441.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="441.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="426.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="426.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="411.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="411.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="396.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="396.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="381.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="381.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="366.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="366.5" width="13" height="12" rx="2"/><rect class="blk a" x="279" y="351.5" width="86" height="12" rx="2"/><rect class="blk kv" x="368" y="351.5" width="13" height="12" rx="2"/>
    <rect class="blk b" x="411" y="546.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="546.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="531.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="531.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="516.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="516.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="501.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="501.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="486.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="486.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="471.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="471.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="456.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="456.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="441.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="441.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="426.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="426.5" width="13" height="12" rx="2"/><rect class="blk b" x="411" y="411.5" width="86" height="12" rx="2"/><rect class="blk kv" x="500" y="411.5" width="13" height="12" rx="2"/>
    <rect class="blk hd" x="411" y="385" width="102" height="19" rx="2"/><text class="rest-in on-head mid" x="462" y="399">output head</text>
    <rect class="blk a" x="544" y="356" width="24" height="13" rx="2"/><text class="rest-s" x="575" y="368">a layer's weights</text>
    <rect class="blk kv" x="544" y="384" width="24" height="13" rx="2"/><text class="rest-s" x="575" y="396">its KV cache</text>
    <rect class="blk hd" x="544" y="412" width="24" height="13" rx="2"/><text class="rest-s" x="575" y="424">output head</text>
    <rect class="blk res" style="fill:url(#ly-hatch)" x="544" y="440" width="24" height="13" rx="2"/><text class="rest-s" x="575" y="452">runtime reserve</text>
    <text class="rest-s mid" x="636" y="496">the host takes</text>
    <text class="rest-s mid" x="636" y="520">what no card holds</text>
    <text class="rest-n mid" x="330" y="598">card A</text><text class="rest-s mid" x="330" y="619">rank 1</text>
    <text class="rest-n mid" x="462" y="598">card B</text><text class="rest-s mid" x="462" y="619">rank 2</text>
    <text class="rest-n mid" x="636" y="598">host</text><text class="rest-s mid" x="636" y="619">host memory</text>
  </g>

  <g data-anim=""/>
</svg>
