<svg xmlns="http://www.w3.org/2000/svg" class="ln" viewBox="0 0 1000 620" role="img" aria-label="A toll road in front of a graphics card: requests drive to a gate with 1 lane, wait in bays by priority, and cross the card in serial or together in the batch worker">
  <defs>
    <linearGradient id="ln-ground" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" class="ln-g0"/><stop offset="1" class="ln-g1"/></linearGradient>
    <linearGradient id="ln-pcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="ln-p0"/><stop offset="1" class="ln-p1"/></linearGradient>
    <linearGradient id="ln-deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ln-d0"/><stop offset="1" class="ln-d1"/></linearGradient>
    <linearGradient id="ln-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ln-r0"/><stop offset="1" class="ln-r1"/></linearGradient>
    <radialGradient id="ln-tree" cx="0.38" cy="0.35" r="0.7"><stop offset="0" class="ln-t0"/><stop offset="1" class="ln-t1"/></radialGradient>
    <linearGradient id="ln-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="ln-b0"/><stop offset="1" class="ln-b1"/></linearGradient>
    <radialGradient id="ln-halo"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="ln-mow" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><rect width="23" height="46" class="ln-mowing"/></pattern>
    <pattern id="ln-trace" width="40" height="40" patternUnits="userSpaceOnUse"><path class="ln-tr" d="M0 10 H14 L22 18 H40 M8 0 V6 M30 40 V30 L36 24 M0 32 H10 L16 26"/><circle class="ln-via" cx="22" cy="18" r="1.6"/><circle class="ln-via" cx="30" cy="30" r="1.6"/></pattern>
    <pattern id="ln-tread" width="14" height="14" patternUnits="userSpaceOnUse"><path class="ln-tq" d="M2 4 L6 2 M9 10 L13 8 M9 3 L12 6 M2 9 L5 12"/></pattern>
    <pattern id="ln-gold" width="9" height="14" patternUnits="userSpaceOnUse"><rect x="1" width="6" height="14" rx="1.2" class="ln-au"/></pattern>
    <pattern id="ln-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" class="ln-hatch"/></pattern>

    <g data-sprite="car" class="veh car">
      <rect class="shd" x="-25" y="-10" width="56" height="28" rx="11"/>
      <rect class="tyre" x="-20" y="-15.5" width="12" height="5" rx="2"/><rect class="tyre" x="9" y="-15.5" width="12" height="5" rx="2"/>
      <rect class="tyre" x="-20" y="10.5" width="12" height="5" rx="2"/><rect class="tyre" x="9" y="10.5" width="12" height="5" rx="2"/>
      <path class="beam" fill="url(#ln-beam)" d="M27,-9 L66,-19 L66,-2 Z M27,9 L66,2 L66,19 Z"/>
      <path class="body" d="M-23,-13 H13 Q27,-13 28,-4 V4 Q27,13 13,13 H-23 Q-28,13 -28,7 V-7 Q-28,-13 -23,-13 Z"/>
      <path class="sheen" d="M-20,-10 H12 Q22,-10 24,-5 H-20 Z"/>
      <path class="glass" d="M3,-10.5 Q12,-9.5 13,0 Q12,9.5 3,10.5 Z"/>
      <rect class="roof" x="-15" y="-9.5" width="18" height="19" rx="4.5"/>
      <path class="glass" d="M-15,-8.5 Q-20,0 -15,8.5 Z"/>
      <path class="crease" d="M14,-9 Q23,-7 24,0 Q23,7 14,9"/>
      <rect class="lamp" x="24.5" y="-10.5" width="3" height="5" rx="1.5"/><rect class="lamp" x="24.5" y="5.5" width="3" height="5" rx="1.5"/>
      <rect class="tail" x="-28" y="-10.5" width="2.5" height="5" rx="1"/><rect class="tail" x="-28" y="5.5" width="2.5" height="5" rx="1"/>
      <g class="haz"><circle cx="-26" cy="-12" r="2.6"/><circle cx="-26" cy="12" r="2.6"/><circle cx="25" cy="-12" r="2.6"/><circle cx="25" cy="12" r="2.6"/></g>
      <g class="sparks"><circle class="spark" cx="-4" cy="0" r="2.4"/><circle class="spark s2" cx="-4" cy="0" r="2"/><circle class="spark s3" cx="-4" cy="0" r="1.7"/></g>
    </g>

    <g data-sprite="truck" class="veh truck">
      <rect class="shd" x="-31" y="-10" width="68" height="28" rx="6"/>
      <rect class="tyre" x="-27" y="-15.5" width="11" height="5" rx="2"/><rect class="tyre" x="-13" y="-15.5" width="11" height="5" rx="2"/><rect class="tyre" x="19" y="-15.5" width="11" height="5" rx="2"/>
      <rect class="tyre" x="-27" y="10.5" width="11" height="5" rx="2"/><rect class="tyre" x="-13" y="10.5" width="11" height="5" rx="2"/><rect class="tyre" x="19" y="10.5" width="11" height="5" rx="2"/>
      <path class="beam" fill="url(#ln-beam)" d="M34,-9 L72,-19 L72,-2 Z M34,9 L72,2 L72,19 Z"/>
      <rect class="cargo" x="-34" y="-14" width="45" height="28" rx="3"/>
      <path class="rib" d="M-26,-14 V14 M-18,-14 V14 M-10,-14 V14 M-2,-14 V14 M6,-14 V14"/>
      <rect class="sheen" x="-32" y="-12" width="41" height="5" rx="2"/>
      <path class="body" d="M13,-12 H26 Q34,-12 34,-4 V4 Q34,12 26,12 H13 Z"/>
      <path class="glass" d="M25,-10 Q31,-8 31,0 Q31,8 25,10 Z"/>
      <rect class="lamp" x="32" y="-10.5" width="2.6" height="4.5" rx="1.2"/><rect class="lamp" x="32" y="6" width="2.6" height="4.5" rx="1.2"/>
      <rect class="tail" x="-34" y="-11" width="2.5" height="5" rx="1"/><rect class="tail" x="-34" y="6" width="2.5" height="5" rx="1"/>
      <g class="haz"><circle cx="-32" cy="-13" r="2.8"/><circle cx="-32" cy="13" r="2.8"/><circle cx="32" cy="-12" r="2.8"/><circle cx="32" cy="12" r="2.8"/></g>
      <g class="sparks"><circle class="spark" cx="-12" cy="0" r="2.4"/><circle class="spark s2" cx="-12" cy="0" r="2"/><circle class="spark s3" cx="-12" cy="0" r="1.7"/></g>
    </g>

    <g data-sprite="ambulance" class="veh amb">
      <rect class="shd" x="-28" y="-10" width="62" height="28" rx="8"/>
      <rect class="tyre" x="-22" y="-15.5" width="12" height="5" rx="2"/><rect class="tyre" x="13" y="-15.5" width="12" height="5" rx="2"/>
      <rect class="tyre" x="-22" y="10.5" width="12" height="5" rx="2"/><rect class="tyre" x="13" y="10.5" width="12" height="5" rx="2"/>
      <path class="beam" fill="url(#ln-beam)" d="M31,-9 L70,-19 L70,-2 Z M31,9 L70,2 L70,19 Z"/>
      <path class="body" d="M-27,-13 H20 Q31,-13 31,-4 V4 Q31,13 20,13 H-27 Q-30,13 -30,10 V-10 Q-30,-13 -27,-13 Z"/>
      <path class="stripe" d="M-30,-10 V-13 H24 Q28,-12.5 29.5,-10 Z M-30,10 V13 H24 Q28,12.5 29.5,10 Z"/>
      <rect class="roofw" x="-25" y="-9" width="34" height="18" rx="3"/>
      <path class="cross" d="M-11,-6 h4 v4 h4 v4 h-4 v4 h-4 v-4 h-4 v-4 h4 Z"/>
      <path class="glass" d="M18,-10.5 Q26,-9 26.5,0 Q26,9 18,10.5 Z"/>
      <circle class="halo hr" cx="12" cy="-5" r="13"/><circle class="halo hb" cx="12" cy="5" r="13"/>
      <rect class="bar-r" x="9" y="-9" width="6" height="8.5" rx="2"/><rect class="bar-b" x="9" y="0.5" width="6" height="8.5" rx="2"/>
      <rect class="lamp" x="28" y="-10.5" width="3" height="5" rx="1.5"/><rect class="lamp" x="28" y="5.5" width="3" height="5" rx="1.5"/>
      <rect class="tail" x="-30" y="-10.5" width="2.5" height="5" rx="1"/><rect class="tail" x="-30" y="5.5" width="2.5" height="5" rx="1"/>
      <g class="sparks"><circle class="spark" cx="-6" cy="0" r="2.4"/><circle class="spark s2" cx="-6" cy="0" r="2"/><circle class="spark s3" cx="-6" cy="0" r="1.7"/></g>
    </g>

    <g data-sprite="ticket" class="ticket">
      <rect class="tk-glow" x="-23" y="-13" width="46" height="26" rx="9"/>
      <rect class="tk" x="-18" y="-8.5" width="36" height="17" rx="4"/>
      <text class="tk-t" x="0" y="3.4">LANE</text>
    </g>

    <g data-sprite="refuse" class="refuse"><g class="pop">
      <rect class="rf-post" x="-2" y="-4" width="4" height="34" rx="1.5"/>
      <rect class="rf" x="-25" y="-30" width="50" height="30" rx="5"/>
      <text class="rf-t" x="0" y="-13">503</text>
      <text class="rf-s" x="0" y="-4.5">BUSY</text>
    </g></g>
  </defs>

  <!-- The ground, its mowing stripes and the trees. -->
  <rect class="ground" x="0" y="0" width="1000" height="620" fill="url(#ln-ground)"/>
  <rect x="0" y="0" width="1000" height="620" fill="url(#ln-mow)"/>
  <g class="trees">
    <ellipse class="tshd" cx="158" cy="200" rx="22" ry="12"/><circle cx="150" cy="190" r="21" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="222" cy="172" rx="15" ry="9"/><circle cx="216" cy="165" r="14" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="306" cy="205" rx="18" ry="10"/><circle cx="299" cy="197" r="17" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="640" cy="160" rx="19" ry="10"/><circle cx="633" cy="151" r="18" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="528" cy="548" rx="24" ry="13"/><circle cx="520" cy="537" r="23" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="588" cy="580" rx="15" ry="9"/><circle cx="582" cy="572" r="14" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="888" cy="560" rx="20" ry="11"/><circle cx="881" cy="550" r="19" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="958" cy="590" rx="15" ry="9"/><circle cx="952" cy="582" r="14" fill="url(#ln-tree)"/>
    <ellipse class="tshd" cx="975" cy="220" rx="16" ry="9"/><circle cx="969" cy="212" r="15" fill="url(#ln-tree)"/>
  </g>

  <!-- The graphics card where the model runs. -->
  <g data-part="card" class="card">
    <rect class="pcb-shd" x="606" y="204" width="330" height="290" rx="16"/>
    <rect class="pcb" x="600" y="196" width="330" height="290" rx="16" fill="url(#ln-pcb)"/>
    <rect x="600" y="196" width="330" height="290" rx="16" fill="url(#ln-trace)"/>
    <rect x="652" y="486" width="226" height="13" fill="url(#ln-gold)"/>
    <g class="chips">
      <rect x="626" y="212" width="26" height="20" rx="2"/><rect x="664" y="212" width="26" height="20" rx="2"/><rect x="702" y="212" width="26" height="20" rx="2"/>
      <rect x="802" y="212" width="26" height="20" rx="2"/><rect x="840" y="212" width="26" height="20" rx="2"/><rect x="878" y="212" width="26" height="20" rx="2"/>
      <rect class="die" x="740" y="208" width="50" height="42" rx="4"/>
    </g>
    <text class="chip-t" x="765" y="233">GPU</text>
    <g class="fan" transform="translate(700 418)"><circle class="fan-ring" r="46"/><g class="blades"><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(72)"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(144)"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(216)"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(288)"/></g><circle class="hub" r="8"/></g>
    <g class="fan" transform="translate(832 418)"><circle class="fan-ring" r="46"/><g class="blades"><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(72)"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(144)"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(216)"/><path d="M0,-6 C10,-26 26,-30 34,-22 C22,-16 12,-8 6,0 Z" transform="rotate(288)"/></g><circle class="hub" r="8"/></g>
  </g>
  <text class="lab" x="600" y="186">MODEL ON THE CARDS</text>

  <!-- The serial lane across the card: 1 request runs there at a time. -->
  <g data-part="bridge" class="bridge">
    <rect class="br-shd" x="600" y="297" width="330" height="54"/>
    <rect class="asph" x="600" y="295" width="330" height="50"/>
    <path class="rail" d="M600,292 H930 M600,348 H930"/>
    <path class="post" d="M612,292 h0 M642,292 h0 M672,292 h0 M702,292 h0 M732,292 h0 M762,292 h0 M792,292 h0 M822,292 h0 M852,292 h0 M882,292 h0 M912,292 h0 M612,348 h0 M642,348 h0 M672,348 h0 M702,348 h0 M732,348 h0 M762,348 h0 M792,348 h0 M822,348 h0 M852,348 h0 M882,348 h0 M912,348 h0"/>
    <path class="flow" d="M604,320 H928"/>
  </g>

  <!-- The batch worker: a deck that carries many requests at once. -->
  <g data-part="deck" class="deck">
    <rect class="dk-shd" x="616" y="214" width="306" height="266" rx="20"/>
    <rect class="dk" x="610" y="206" width="306" height="266" rx="20" fill="url(#ln-deck)"/>
    <rect x="610" y="206" width="306" height="266" rx="20" fill="url(#ln-tread)"/>
    <rect class="rim" x="616" y="212" width="294" height="254" rx="15"/>
    <g transform="translate(888 236)"><g class="gear"><path d="M-3,-14 h6 l1,4 l4,2 l4,-2 l4,4 l-2,4 l2,4 l4,1 v6 l-4,1 l-2,4 l2,4 l-4,4 l-4,-2 l-4,2 l-1,4 h-6 l-1,-4 l-4,-2 l-4,2 l-4,-4 l2,-4 l-2,-4 l-4,-1 v-6 l4,-1 l2,-4 l-2,-4 l4,-4 l4,2 l4,-2 Z" transform="translate(0 -3)"/><circle r="4.5" class="gear-h" cy="0"/></g></g>
    <text class="dk-t" x="630" y="236">BATCH WORKER</text>
    <text class="dk-s" x="630" y="250">many requests run together</text>
  </g>

  <!-- The road that skips the gate, open only while the model batches. -->
  <g data-part="bypass" class="bypass">
    <path class="by-curb" d="M44,336 C66,392 96,446 170,446 L604,446"/>
    <path class="by-asph" d="M44,336 C66,392 96,446 170,446 L604,446"/>
    <path class="by-arrows" d="M184,446 H318 M482,446 H596"/>
    <text class="by-t" x="400" y="450">STRAIGHT TO THE WORKER</text>
    <g class="cones"><path d="M70,402 l5,-12 l5,12 Z"/><path d="M84,414 l5,-12 l5,12 Z"/><path d="M98,424 l5,-12 l5,12 Z"/></g>
    <text class="by-c" x="126" y="472">CLOSED IN SERIAL</text>
  </g>

  <!-- The approach: 1 lane, 3 bays by priority, and the lane through the gate. -->
  <g class="road">
    <path class="curb" d="M-10,295 L106,295 C134,295 132,237 160,237 L352,237 C378,237 372,295 398,295 L600,295 L600,345 L398,345 C372,345 378,403 352,403 L160,403 C132,403 134,345 106,345 L-10,345 Z"/>
    <path class="asph" d="M-10,295 L106,295 C134,295 132,237 160,237 L352,237 C378,237 372,295 398,295 L600,295 L600,345 L398,345 C372,345 378,403 352,403 L160,403 C132,403 134,345 106,345 L-10,345 Z"/>
    <rect class="island" x="172" y="287.5" width="168" height="7" rx="3.5"/><rect class="island" x="172" y="345.5" width="168" height="7" rx="3.5"/>
    <path class="stop" d="M344,240 V285 M344,297 V343 M344,355 V400"/>
    <rect class="bay-fim" x="162" y="241" width="4" height="42" rx="2"/><rect class="bay-int" x="162" y="299" width="4" height="42" rx="2"/><rect class="bay-bat" x="162" y="357" width="4" height="42" rx="2"/>
    <text class="paint" x="172" y="265">FIM</text><text class="paint" x="172" y="323">INTERACTIVE</text><text class="paint" x="172" y="381">BATCH</text>
    <path class="edge" d="M-10,298.5 H104 M-10,341.5 H104 M400,298.5 H598 M400,341.5 H598"/>
    <rect class="curb" x="930" y="295" width="80" height="50"/><rect class="asph" x="930" y="295" width="80" height="50"/>
    <path class="chev" d="M952,310 l10,10 l-10,10 M972,310 l10,10 l-10,10"/>
  </g>
  <text class="lab lq" x="256" y="226" text-anchor="middle">QUEUE: BY PRIORITY, THEN ARRIVAL</text>
  <text class="lab lab-s lr" x="997" y="284" text-anchor="end">RESPONSE</text>

  <!-- The meter that counts every request from its arrival. -->
  <g data-part="meter" class="meter">
    <path class="gantry" d="M30,252 V292 M30,348 V352"/>
    <rect class="led-box" x="6" y="226" width="52" height="34" rx="5"/>
    <text class="led-ghost" x="32" y="251">88</text>
  </g>
  <text class="lab lm" x="32" y="218" text-anchor="middle">METER</text>

  <!-- The gate: the booth with its ticket, and the arm across the lane. -->
  <g data-part="gate" class="gate">
    <rect class="booth-shd" x="418" y="256" width="42" height="34" rx="4"/>
    <rect class="booth" x="414" y="252" width="40" height="32" rx="4"/>
    <rect class="slot" x="417" y="261" width="34" height="16" rx="4"/>
    <circle class="pivot" cx="404" cy="291" r="5"/>
    <g class="arm"><rect class="arm-b" x="401" y="291" width="6" height="58" rx="3"/><path class="arm-s" d="M404,301 v6 M404,317 v6 M404,333 v6"/></g>
  </g>

  <g data-anim="" data-reach="30"></g>

  <!-- What stands over the vehicles: the gantries, the roof of the gate and its lamp. -->
  <g class="over">
    <path class="beam-g" d="M30,286 V354"/>
    <rect class="gpost" x="26" y="284" width="8" height="8" rx="2"/><rect class="gpost" x="26" y="348" width="8" height="8" rx="2"/>
    <rect class="canopy" x="392" y="244" width="78" height="112" rx="6" fill="url(#ln-roof)"/>
    <path class="canopy-l" d="M400,244 V356 M462,244 V356"/>
    <path class="beam-g" d="M530,282 V358"/>
    <rect class="gpost" x="526" y="280" width="8" height="8" rx="2"/><rect class="gpost" x="526" y="352" width="8" height="8" rx="2"/>
  </g>
  <g data-part="gate" class="gate lampg">
    <rect class="lamp-box" x="379" y="252" width="16" height="30" rx="5"/>
    <circle class="lamp-r" cx="387" cy="260" r="4.6"/>
    <circle class="lamp-g" cx="387" cy="274" r="4.6"/>
  </g>
  <text class="lab-b" x="431" y="236" text-anchor="middle">GATE</text>
  <text class="lab" x="431" y="372" text-anchor="middle">1 LANE</text>

  <!-- The sign that tells how the model serves. -->
  <g data-part="mode" class="mode">
    <rect class="vms" x="478" y="238" width="104" height="32" rx="5"/>
    <text class="m m-serial" x="530" y="259">SERIAL</text>
    <text class="m m-next" x="530" y="259">BATCH NEXT</text>
    <text class="m m-batch" x="530" y="259">BATCHING</text>
  </g>
  <text class="lab" x="530" y="230" text-anchor="middle">MODE</text>
</svg>
