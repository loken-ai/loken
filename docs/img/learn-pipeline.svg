<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="DejaVu Sans, Liberation Sans, Helvetica, Arial, sans-serif">
<style>
.b{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
.c{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.g{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.t{fill:#24292f;font-size:13px}
.s{fill:#57606a;font-size:11px}
.h{fill:#57606a;font-size:11px;letter-spacing:.06em}
.a{stroke:#57606a;stroke-width:1.2;fill:none;marker-end:url(#m)}
.d{stroke:#cf222e;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
.r{fill:#cf222e;font-size:11px}
@media (prefers-color-scheme:dark){
.b{fill:#161b22;stroke:#6e7681}.c{fill:#0c2d6b;stroke:#58a6ff}.g{fill:#0f3a1f;stroke:#3fb950}
.t{fill:#e6edf3}.s,.h{fill:#8b949e}.a{stroke:#8b949e}.d{stroke:#ff7b72}.r{fill:#ff7b72}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<text class="h" x="20" y="24">ONE REQUEST, FROM TEXT TO JSON</text>

<rect class="b" x="20" y="60" width="110" height="52" rx="6"/>
<text class="t" x="75" y="82" text-anchor="middle">text</text>
<text class="s" x="75" y="100" text-anchor="middle">messages, tools</text>

<rect class="b" x="160" y="60" width="110" height="52" rx="6"/>
<text class="t" x="215" y="82" text-anchor="middle">template</text>
<text class="s" x="215" y="100" text-anchor="middle">one string</text>

<rect class="b" x="300" y="60" width="110" height="52" rx="6"/>
<text class="t" x="355" y="82" text-anchor="middle">tokenizer</text>
<text class="s" x="355" y="100" text-anchor="middle">ids</text>

<rect class="c" x="440" y="60" width="130" height="52" rx="6"/>
<text class="t" x="505" y="82" text-anchor="middle">prefill</text>
<text class="s" x="505" y="100" text-anchor="middle">all ids, one pass</text>

<rect class="c" x="600" y="60" width="130" height="52" rx="6"/>
<text class="t" x="665" y="82" text-anchor="middle">decode</text>
<text class="s" x="665" y="100" text-anchor="middle">one id per pass</text>

<rect class="g" x="760" y="60" width="120" height="52" rx="6"/>
<text class="t" x="820" y="82" text-anchor="middle">sample</text>
<text class="s" x="820" y="100" text-anchor="middle">logits to one id</text>

<line class="a" x1="130" y1="86" x2="158" y2="86"/>
<line class="a" x1="270" y1="86" x2="298" y2="86"/>
<line class="a" x1="410" y1="86" x2="438" y2="86"/>
<line class="a" x1="570" y1="86" x2="598" y2="86"/>
<line class="a" x1="730" y1="86" x2="758" y2="86"/>

<line class="a" x1="820" y1="112" x2="820" y2="150"/>
<path class="a" d="M820,150 L700,150 L700,118" />
<text class="s" x="760" y="166" text-anchor="middle">next id back into decode</text>

<rect class="b" x="300" y="200" width="110" height="52" rx="6"/>
<text class="t" x="355" y="222" text-anchor="middle">detokenizer</text>
<text class="s" x="355" y="240" text-anchor="middle">ids to text</text>

<rect class="b" x="160" y="200" width="110" height="52" rx="6"/>
<text class="t" x="215" y="222" text-anchor="middle">splitter</text>
<text class="s" x="215" y="240" text-anchor="middle">thinking, tools</text>

<rect class="b" x="20" y="200" width="110" height="52" rx="6"/>
<text class="t" x="75" y="222" text-anchor="middle">JSON</text>
<text class="s" x="75" y="240" text-anchor="middle">streamed or whole</text>

<path class="a" d="M600,86 L580,86 L580,226 L412,226"/>
<line class="a" x1="300" y1="226" x2="272" y2="226"/>
<line class="a" x1="160" y1="226" x2="132" y2="226"/>

<rect class="d" x="10" y="48" width="420" height="216" rx="8"/>
<text class="r" x="20" y="284">the token/JSON boundary: no arithmetic here, and every defect of lesson 1 lived here</text>
<text class="s" x="505" y="284" text-anchor="middle">the model: lessons 4 to 8</text>
</svg>
