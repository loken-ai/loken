[package]
name = "loken"
version = "0.1.0"
edition = "2021"
description = "A local, multimodal inference server: language, image, audio and video models, in Rust"
repository = "https://github.com/loken-ai/loken"
keywords = ["llm", "inference", "multimodal", "cuda"]
categories = ["science", "multimedia"]
license = "MIT OR Apache-2.0"
autobins = false

[dependencies]
libc = "0.2"
# Web framework and HTTP
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_qs = "0.13"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system and paths
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
dirs = "5.0"
memmap2 = "0.9"

# Networking
reqwest = { version = "0.13", features = ["json", "blocking", "stream", "multipart"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async streams
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
rand = "0.10"

# Cryptography, for the API-key authentication
sha2 = "0.10"
hex = "0.4"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config persistence
toml = "1.1"

# Image handling for vision models
image = "0.25"

# Base64 encoding/decoding for vision model image input
base64 = "0.22"

# Audio (whisper ASR) - WAV decoding + mel-filter byte parsing + resampling
hound = "3.5"
byteorder = "1.5"
rubato = "0.16"
# Decode MP3/FLAC/OGG-Vorbis input on the ASR endpoints. WAV stays on
# hound for fewer codec branches on the hot path.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "isomp4", "aac"] }
# zlib compression - used to compute whisper's per-segment
# `compression_ratio` (text len / zlib(text) len). Whisper's paper
# treats ratios > 2.4 as a hallucination signal.
flate2 = "1.0"

# GPU management - NVML for NVIDIA GPU support
nvml-wrapper = "0.12"

# ML inference - loken's own native tensor substrate (src/tensor):
# all models implemented in-crate (inference/native_* + generic_transformer +
# native_sampling/native_ops); quantized GGUF + safetensors loaders included.
# cudarc backs the CUDA device, stream and NCCL layer. A small local delta over it
# is tracked separately at loken-ai/cudarc, which exists to be deleted:
# two of its patches are upstreamable and the third can move into this crate's
# allocator, because the synchronous allocation entry points it needs are public.
# Pinned by revision, not by path: a sibling checkout is how the author works, not something a
# clone has, and `cargo build` failing on a manifest error is a bad first impression. To work on
# the patches locally, add a `[patch]` override to your own .cargo/config.toml - that keeps the
# convenience out of the file everybody gets.
cudarc = { git = "https://github.com/loken-ai/cudarc.git", rev = "d307a98", package = "cudarc", optional = true, default-features = false, features = [
    "std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8",
    "cuda-version-from-build-system", "dynamic-linking", "nccl",
] }
tokenizers = "0.21"
hf-hub = "0.4"

# Grammar-constrained decoding. Used to compile JSON schemas /
# Lark grammars into per-token logit masks. Lazy: only used when a request
# sets response_format/grammar; no cost on the default path.
llguidance = "1.7"
toktrie_hf_tokenizers = "1.7"
half = "2.4"
safetensors = "0.7.0"
# Byte manipulation utilities
bytemuck = { version = "1.15", features = ["derive"] }

# GGUF format support is built into the native tensor substrate

# System monitoring
sysinfo = "0.33"
ahash = "0.8.12"
num_cpus = "1.16"
which = "6.0"

# CPU parallelism for multi-core inference
rayon = "1.10"

# CPU core affinity for P-core pinning
core_affinity = "0.8"

# Lazy static initialization
once_cell = "1.20"

# GPU compute shaders for Intel Arc / AMD support (via OpenCL)
opencl3 = { version = "0.9", optional = true }
minijinja = { version = "2.23.0", default-features = false, features = ["builtins", "macros", "serde"] }

# macOS Metal enumeration (already transitive, needs explicit for gui code)
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

[features]
default = ["cuda", "opencl", "media"]

# The generative-media families. Each compiles its own model ports, engines and
# routes; a build without them serves language models and nothing else.
media = ["image", "video", "audio", "midi"]
image = []
audio = []
video = ["image"]   # a clip is conditioned on an image and decoded through its VAE
midi = ["audio"]    # rendered to sound through the audio stack
# Enable CUDA support (requires CUDA toolkit 11.x or 12.x installation)
# Install CUDA from: https://developer.nvidia.com/cuda-downloads
cuda = ["dep:cudarc"]
# A GET /metrics scrape endpoint. Off by default: the published default binds localhost and
# does not authenticate, and compiling a scrape endpoint in regardless would widen that
# surface without anyone asking. When on it sits behind the same authentication as every
# other route.
metrics = []
# Enable GGUF format support (for Ollama models)
# Enable SYCL support (Intel Arc/Xe)
# Enable OpenCL backend for Intel Arc / AMD GPU inference via OpenCL kernels
opencl = ["dep:opencl3"]
# Pure CPU build - no GPU runtime deps. Useful for cloud CPU
# instances and constrained environments. Build with:
#   cargo build --release --no-default-features --features cpu
# Just `--no-default-features` already works (no cuda/opencl);
# the `cpu` feature exists so downstream Cargo.toml can request
# the explicit CPU-only mode without depending on Cargo defaults.
cpu = []
# Build the one-off dev validator / parity / microbench binaries (see the
# [[bin]] section below). Off by default so ~100 dev bins do not compile on
# every build; some have pre-existing breakage and must not block releases.

[dev-dependencies]
criterion = "0.5"

# ---------------------------------------------------------------------------
# Binaries. `autobins = false` (see [package]): both are listed explicitly, so a stray file
# under src/bin/ never becomes a shipped program by accident.
# ---------------------------------------------------------------------------

# The daemon and the client, split the way Unix has always split them: `lokend` serves, `loken`
# talks to it. The name anyone types often is the short one, and it is also the small binary  - 
# every subcommand but `serve` is an HTTP call, so a laptop needs 11 MB rather than the 180 MB
# of CUDA kernels the daemon carries.
[[bin]]
name = "lokend"
path = "src/bin/lokend.rs"

[[bin]]
name = "loken"
path = "src/bin/loken.rs"

