[advisories]
yanked = "deny"
# Unmaintained crates reached only through dependencies that have no maintained
# alternative yet: number_prefix through indicatif, paste through the image codecs,
# proc-macro-error through validator. None of the three is on a request path.
ignore = [
    "RUSTSEC-2025-0119",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
]

[licenses]
# The crate is MIT OR Apache-2.0 and should only depend on things that can live
# inside that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "NCSA",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The CUDA bindings carry a small local delta, tracked as a fork until it is upstreamed.
allow-git = ["https://github.com/loken-ai/cudarc"]
